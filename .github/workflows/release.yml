name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        default: 1.0.0

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: osx
          - os: ubuntu-latest
            target: linux
          - os: windows-latest
            target: win
    runs-on: ${{ matrix.os }}
    env:
      DECKWRAITH_ELECTRON_TARGET: ${{ matrix.target }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Package Electron application
        shell: bash
        run: ./eng/package-desktop.sh "${{ steps.version.outputs.value }}"
      - name: Stage release distributables
        shell: bash
        run: >-
          ./eng/stage-release-artifacts.sh
          src/Deckwraith.Desktop/obj/artifacts/desktop
          artifacts/release
          "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: deckwraith-${{ matrix.target }}-${{ steps.version.outputs.value }}
          path: artifacts/release/*
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Remove an incomplete release before publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          set +e
          deckwraith_lookup="$(gh api \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --jq .id 2>&1)"
          deckwraith_status=$?
          set -e
          if [[ "$deckwraith_status" -eq 0 ]]; then
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/releases/${deckwraith_lookup}"
          elif [[ "$deckwraith_lookup" != *"HTTP 404"* ]]; then
            echo "$deckwraith_lookup" >&2
            exit "$deckwraith_status"
          fi
      - name: Publish GitHub release
        id: publish_release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          preserve_order: true
          files: artifacts/**/*
      - name: Back off after a publication rate limit
        if: steps.publish_release.outcome == 'failure'
        run: sleep 180
      - name: Retry GitHub release publication
        if: steps.publish_release.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          preserve_order: true
          files: artifacts/**/*
