name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  headless-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Test core
        run: ./eng/run-ci-test.sh tests/Deckwraith.Core.Tests/Deckwraith.Core.Tests.csproj
      - name: Test persistence
        run: ./eng/run-ci-test.sh tests/Deckwraith.Persistence.Tests/Deckwraith.Persistence.Tests.csproj
      - name: Test integration
        run: ./eng/run-ci-test.sh tests/Deckwraith.IntegrationTests/Deckwraith.IntegrationTests.csproj
      - name: Test notebooks
        run: ./eng/run-ci-test.sh tests/Deckwraith.Notebooks.Tests/Deckwraith.Notebooks.Tests.csproj
      - name: Test kernel contracts
        run: ./eng/run-ci-test.sh tests/Deckwraith.Kernels.ContractTests/Deckwraith.Kernels.ContractTests.csproj
      - name: Test PowerShell
        run: ./eng/run-ci-test.sh tests/Deckwraith.PowerShell.Tests/Deckwraith.PowerShell.Tests.csproj
      - name: Test MCP
        run: ./eng/run-ci-test.sh tests/Deckwraith.Mcp.Tests/Deckwraith.Mcp.Tests.csproj
      - name: Test continuity
        run: ./eng/run-ci-test.sh tests/Deckwraith.Continuity.Tests/Deckwraith.Continuity.Tests.csproj
      - name: Test providers
        run: ./eng/run-ci-test.sh tests/Deckwraith.Providers.ContractTests/Deckwraith.Providers.ContractTests.csproj
      - name: Test host bridge
        run: ./eng/run-ci-test.sh tests/Deckwraith.Hosting.Tests/Deckwraith.Hosting.Tests.csproj
      - name: Verify headless dependency graph
        run: ./eng/verify-headless.sh linux-x64 --publish-only

  renderer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  desktop-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            rid: osx-x64
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - name: Publish self-contained desktop payload
        run: >-
          dotnet publish src/Deckwraith.Desktop/Deckwraith.Desktop.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -o artifacts/desktop-publish/${{ matrix.rid }}
      - name: Verify renderer payload
        shell: bash
        run: test -f artifacts/desktop-publish/${{ matrix.rid }}/wwwroot/index.html
